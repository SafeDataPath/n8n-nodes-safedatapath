# Publishes the package to npm with a provenance statement on every version tag (for example 0.1.0),
# as n8n requires for verified community nodes. Run `npm run release` locally to bump, tag and push.
#
# npm authentication: the Trusted Publisher set on npmjs.com for this repository and publish.yml (OIDC).
# No token is stored; an NPM_TOKEN secret is only a fallback.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          # As in npm's trusted publishing example: npm then exchanges the OIDC token for this registry.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Show npm version
        # Trusted publishing needs npm 11.5.1 or later.
        run: npm --version

      - name: Release
        # Lint, build, then npm publish with provenance (n8n-node release in CI mode).
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
